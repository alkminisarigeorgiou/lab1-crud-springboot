<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>resourcely - Edit resource</title>
  <style>
        form { width: 50%; margin: 20px auto; }
        label { display: block; margin: 10px 0 5px; }
        input, button { margin-bottom: 10px; }
    </style>
</head>
<body>
<h1>Edit resource</h1>
<form th:action="@{/resources/edit/{id}(id=${resource.id})}" th:object="${resource}" method="post">
  <label>Name:</label>
  <input type="text" th:field="*{name}" />
  <label>Description:</label>
  <input type="text" th:field="*{description}" />
  <label>Price:</label>
  <input type="number" step="0.01" th:field="*{quantity}" />
  <button type="submit">Save resource</button>
</form>
<a href="/resources">Back to resources</a>
</body>
</html>
